<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Team Vijrumbhana | Admin Dashboard</title><link rel="stylesheet" href="styles.css"><script src="config.js" defer></script><script src="admin.js" defer></script></head>
<body><header class="hero"><h1>TEAM VIJRUMBHANA</h1><p class="tagline">Administrator Dashboard</p><p class="intro">Authorized access only. Sign in to review and manage student complaints.</p></header>
<main class="container"><section class="form-card" id="loginSection"><h2>Admin Login</h2><p class="muted">Enter your administrator password.</p><form id="loginForm"><label for="password">Admin Password</label><input type="password" id="password" required autocomplete="current-password"><button type="submit" id="loginButton">Login</button><p id="loginMessage" role="status" aria-live="polite"></p></form></section>
<section id="dashboardSection" hidden><div class="form-card"><h2>Complaint Dashboard</h2><p class="muted" id="summary"></p><button type="button" id="refreshButton">Refresh Complaints</button><button type="button" id="logoutButton">Logout</button><p id="dashboardMessage" role="status" aria-live="polite"></p><div id="complaintsList"></div></div></section></main><footer><p>© 2026 Team Vijrumbhana</p></footer></body></html>
